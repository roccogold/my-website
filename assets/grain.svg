<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.18" intercept="-0.09"/>
      <feFuncG type="linear" slope="1.18" intercept="-0.09"/>
      <feFuncB type="linear" slope="1.18" intercept="-0.09"/>
    </feComponentTransfer>
  </filter>
  <rect width="320" height="320" fill="#808080" filter="url(#grain)"/>
</svg>
